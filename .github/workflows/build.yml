name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Show repo layout
        run: |
          pwd
          ls -la
          echo "--- dove sono i file del progetto ---"
          find . -maxdepth 4 \( -name "settings.gradle.kts" -o -name "AndroidManifest.xml" \) | head -20

      - name: Check project layout
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts NON e' nella root: i file sono finiti in una sottocartella. Guarda lo step precedente."
            exit 1
          fi

      - name: Verify protocol references
        if: always()
        continue-on-error: true
        run: python3 tools/verify_refs.py --out docs

      - name: Upload refs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refs-report
          path: docs/refs_report.*
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          set -e
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDKROOT=$SDKROOT"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then SM="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SM" ]; then SM="$(find "$SDKROOT" -name sdkmanager -type f 2>/dev/null | head -1)"; fi
          echo "sdkmanager=$SM"
          "$SM" --version
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidstream-m0
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
